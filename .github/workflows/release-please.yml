name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Манифест-режим: конфиг в release-please-config.json,
          # текущие версии — в .release-please-manifest.json
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
