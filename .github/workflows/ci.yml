name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Отменяем предыдущие запуски того же ref, чтобы не гонять CI дважды
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            server/package-lock.json

      # Ставим зависимости всех трёх частей строго по lock-файлам
      - name: Install root deps (TypeSpec)
        run: npm ci
      - name: Install web deps
        run: npm ci --prefix web
      - name: Install server deps
        run: npm ci --prefix server

      # Спека — источник истины: компилируем TypeSpec → OpenAPI, затем типы фронта
      - name: Compile TypeSpec spec
        run: make spec

      - name: Generate frontend API types
        run: make gen

      # Сгенерированные типы должны совпадать с закоммиченными
      - name: Verify generated types are up to date
        run: git diff --exit-code web/src/api/schema.d.ts

      - name: Typecheck frontend
        run: make typecheck

      - name: Build frontend
        run: make build

      - name: Backend tests
        run: make test
