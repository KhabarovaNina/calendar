name: Auto PR

# При пуше фичеветки автоматически открываем PR в main.
# main/dev и служебные ветки release-please пропускаем.
on:
  push:
    branches-ignore:
      - main
      - dev
      - 'release-please--**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open PR into main if none exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_REF_NAME}"
          # Если открытый PR для этой ветки уже есть — ничего не делаем
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR для '$branch' уже открыт — пропускаю."
            exit 0
          fi
          # --fill берёт заголовок и описание из сообщений коммитов ветки,
          # так что описание не будет пустым
          gh pr create --base main --head "$branch" --fill
